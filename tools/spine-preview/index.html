<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spine 3.8 预览</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="title">Spine 3.8 预览</span>
    <span id="current" class="current">未选择</span>
    <span id="status" class="status"></span>
  </header>

  <div class="layout">
    <!-- 左侧:选择来源 + spine 列表 + 搜索 -->
    <aside class="sidebar">
      <div class="picker">
        <div class="picker-row">
          <button id="pickDir">选择目录…</button>
          <button id="pickFile">选择文件…</button>
        </div>
        <div class="picker-row">
          <input id="pathInput" class="path-input" type="text" placeholder="或粘贴目录/文件路径，回车加载" />
          <button id="loadPath">加载</button>
        </div>
        <div id="rootLabel" class="root-label" title="">未选择</div>
      </div>
      <input id="search" class="search" type="search" placeholder="搜索名称 / 路径…" />
      <div id="list" class="list"></div>
    </aside>

    <!-- 主区:工具栏 + 画布 + 时间轴 -->
    <main class="viewer">
      <div class="toolbar">
        <label>动画
          <select id="anim"></select>
        </label>
        <label>皮肤
          <select id="skin"></select>
        </label>
        <button id="playpause" title="播放/暂停">⏸</button>
        <label class="chk"><input id="loop" type="checkbox" checked /> 循环</label>
        <label>速度 <span id="speedval">1.0×</span>
          <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1" />
        </label>
        <span class="sep"></span>
        <button id="fit" title="适应窗口">适应</button>
        <button id="reset" title="重置缩放/平移">重置视图</button>
        <span class="sep"></span>
        <span class="bglabel">背景</span>
        <span class="bgswatches" id="bg"></span>
        <label class="chk" title="贴图非预乘时取消勾选可修正边缘发黑/发亮">
          <input id="pma" type="checkbox" checked /> 预乘 Alpha
        </label>
      </div>

      <div class="stage">
        <canvas id="canvas"></canvas>
        <div id="overlay" class="overlay hidden"></div>
      </div>

      <div class="timeline">
        <input id="seek" type="range" min="0" max="1000" step="1" value="0" />
        <span id="time" class="time">0.00 / 0.00s</span>
      </div>
    </main>
  </div>

  <script src="vendor/spine-webgl.js"></script>
  <script src="app.js"></script>
</body>
</html>
